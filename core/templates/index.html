<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha Loja da Bandaaa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">Minha Loja</a>
        <a class="btn btn-light btn-sm" href="/admin" target="_blank">Área Admin</a>
      </div>
    </nav>

    <div class="container">
      
      <div class="text-center mb-5">
        <h1 class="display-4">Ofertas da Semana</h1>
        <p class="lead">Produtos cadastrados via Django Admin</p>
        <a href="/sobre" class="btn btn-outline-primary">Sobre o Projeto</a>
      </div>

      <div class="row">
        
        {% for produto in lista_produtos %}
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            {% if produto.imagem %}
    <img src="{{ produto.imagem.url }}" class="card-img-top" alt="{{ produto.nome }}" style="height: 200px; object-fit: cover;">
{% else %}
    <div class="bg-secondary text-white d-flex justify-content-center align-items-center" style="height: 200px;">
        Sem Foto
    </div>
{% endif %}
            <div class="card-body">
              <h5 class="card-title text-primary">{{ produto.nome }}</h5>
              <p class="card-text text-muted">{{ produto.descricao }}</p>
              <h3 class="text-success">R$ {{ produto.preco }}</h3>
            </div>
            <div class="card-footer bg-white border-top-0">
                <a href="/produto/{{ produto.id }}/" class="btn btn-primary w-100">Ver Detalhes</a>
            </div>
          </div>
        </div>
        {% endfor %}
        </div>
    </div>

  </body>
</html>
