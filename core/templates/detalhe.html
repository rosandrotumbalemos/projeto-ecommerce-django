<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ produto.nome }} - Detalhes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container mt-5">
      <a href="/" class="btn btn-outline-secondary mb-3">← Voltar para a Loja</a>

      <div class="card shadow">
        <div class="card-body">
          <div class="row">
            <div class="col-md-8">
                <h1 class="display-4">{{ produto.nome }}</h1>
                <hr>
                <p class="lead">{{ produto.descricao }}</p>
                <p>Aqui você pode colocar mais detalhes técnicos, especificações, etc.</p>
            </div>

            <div class="col-md-4 text-center bg-light p-4 rounded">
                <h3 class="text-success mb-3">R$ {{ produto.preco }}</h3>
                <button class="btn btn-success btn-lg w-100" onclick="alert('Item adicionado ao carrinho!')">
                    Comprar Agora
                </button>
                <p class="mt-3 text-muted small">Entrega imediata</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
