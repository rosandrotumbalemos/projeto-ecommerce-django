{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>{{ produto.nome }} - Ukilla Vibe</title>
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    </head>
    <body id="page-top" style="background-color: #f8f9fa;">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
            <div class="container">
                <a class="navbar-brand" href="{% url 'pagina_inicial' %}">
                    <img src="{% static 'assets/img/navbar-logo.svg' %}" alt="..." style="height: 40px;" />
                </a>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'pagina_inicial' %}">
                                <i class="fas fa-arrow-left me-2"></i>Voltar para Loja
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <section class="page-section">
            <div class="container" style="margin-top: 60px;">
                <div class="row align-items-center">
                    
                    <div class="col-lg-6">
                        {% if produto.imagem %}
                            <img class="img-fluid rounded mb-5 mb-lg-0 shadow-lg" src="{{ produto.imagem.url }}" alt="{{ produto.nome }}" style="width: 100%; object-fit: cover;" />
                        {% else %}
                            <img class="img-fluid rounded mb-5 mb-lg-0" src="https://dummyimage.com/600x400/dee2e6/6c757d.jpg" alt="..." />
                        {% endif %}
                    </div>

                    <div class="col-lg-6">
                        <div class="text-start">
                            <h1 class="font-weight-light mb-2">{{ produto.nome }}</h1>
                            <div class="small text-warning mb-4">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            
                            <h2 class="display-6 fw-bolder mb-4">R$ {{ produto.preco }}</h2>
                            
                            <p class="lead text-muted mb-4">{{ produto.descricao }}</p>
                            
                            <div class="d-flex">
                                <button class="btn btn-primary btn-xl text-uppercase flex-shrink-0 me-3" type="button">
                                    <i class="fas fa-shopping-cart me-1"></i>
                                    Comprar Agora
                                </button>
                                
                                <a href="https://wa.me/?text=Tenho interesse no {{ produto.nome }}" target="_blank" class="btn btn-success btn-xl text-uppercase">
                                    <i class="fab fa-whatsapp me-1"></i>
                                    Negociar
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <footer class="footer py-4 bg-light">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-4 text-lg-start">Copyright &copy; AEMBI 2026</div>
                    <div class="col-lg-4 text-lg-end">
                        <a class="link-dark text-decoration-none me-3" href="#!">Voltar ao Topo</a>
                    </div>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
    </body>
</html>
